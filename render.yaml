services:
  - type: web
    name: assistant-evaluation
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: REQUIRE_APP_AUTH
        value: "1"
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
