defaults:
  timeout: 120
  max_tokens: 2048
  temperature: 0.0
models:
- name: Qwen2.5-7B
  type: fireworks
  model_id: accounts/fireworks/models/qwen2p5-7b
  api_key: ${FIREWORKS_API_KEY}
- name: Qwen2.5-14B
  type: fireworks
  model_id: accounts/fireworks/models/qwen2p5-coder-14b
  api_key: ${FIREWORKS_API_KEY}
- name: Mistral-7B
  type: fireworks
  model_id: accounts/fireworks/models/mistral-7b-instruct-v3
  api_key: ${FIREWORKS_API_KEY}
- name: GPT-4o
  type: openai
  model_id: gpt-4o
  api_key: ${OPENAI_API_KEY}
- name: Gemini-3.1-pro-preview
  type: gemini
  model_id: gemini-3.1-pro-preview
  api_key: ${GOOGLE_API_KEY}
- name: Claude-Sonnet
  type: claude
  model_id: claude-sonnet-5
  api_key: ${ANTHROPIC_API_KEY}
evaluation:
  bertscore_lang: en
  bertscore_model: null
output:
  csv_path: results/eval_results.csv
  show_table: true
